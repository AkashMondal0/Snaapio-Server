events {}

http {
    upstream server {
        server server:5000;  # Points to the nodejs container
    }

    server {
        listen 80;

        server_name 4.213.1.229;  # Replace with your domain or IP

        location / {
            proxy_pass http://server;  # Pass requests to the Node.js container
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /socket.io/ {
            proxy_pass http://server/socket.io/;  # Pass requests to the Node.js container
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
